<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Greek Wedding — Your Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#FDFAF5;--surface:#FFFFFF;--surface2:#F5F0E8;--ink:#1A1714;--mid:#6B6052;--light:#A09080;--gold:#C9A96E;--gold-light:#F0E6D3;--gold-dark:#A8864A;--rose:#C97A7A;--rose-light:#F5E8E8;--green:#5A8A5A;--green-light:#E8F2E8;--blue:#5A7A9A;--blue-light:#E8EFF5;--border:rgba(201,169,110,0.2);--border-strong:rgba(201,169,110,0.35);--shadow:0 2px 20px rgba(26,23,20,0.08);--shadow-lg:0 8px 40px rgba(26,23,20,0.12);--radius:14px;--radius-sm:9px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Jost',sans-serif;font-weight:300;background:var(--bg);color:var(--ink);min-height:100vh;}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:24px;}
.login-logo{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2.6rem;color:var(--gold);letter-spacing:0.02em;}
.login-sub{font-size:0.8rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--light);}
.login-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:36px 44px;display:flex;flex-direction:column;gap:16px;width:340px;box-shadow:var(--shadow-lg);}
.login-box input{border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:11px 14px;font-family:'Jost',sans-serif;font-size:0.9rem;outline:none;background:var(--bg);width:100%;}
.login-box input:focus{border-color:var(--gold);}
.login-box button{background:var(--gold);color:#fff;border:none;border-radius:var(--radius-sm);padding:12px;font-family:'Jost',sans-serif;font-weight:500;font-size:0.92rem;cursor:pointer;transition:background 0.2s;}
.login-box button:hover{background:var(--gold-dark);}
.login-err{color:var(--rose);font-size:0.8rem;text-align:center;display:none;}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh;}

/* HERO */
.hero{background:linear-gradient(135deg,#1A1714 0%,#2D2520 50%,#1A1714 100%);padding:40px 32px 36px;color:#fff;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C9A96E' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");}
.hero-content{position:relative;z-index:1;max-width:700px;margin:0 auto;text-align:center;}
.hero-names{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2.8rem;color:var(--gold);margin-bottom:8px;}
.hero-date{font-size:0.85rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.6);margin-bottom:24px;}
.hero-countdown{display:flex;gap:24px;justify-content:center;margin-top:4px;}
.countdown-item{text-align:center;}
.countdown-num{font-size:2.2rem;font-weight:500;color:var(--gold);line-height:1;}
.countdown-label{font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-top:4px;}
.hero-location{font-size:0.82rem;color:rgba(255,255,255,0.5);margin-top:16px;}

/* TOP BAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.topbar-logo{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:1.2rem;flex:1;}
.topbar-user{font-size:0.8rem;color:var(--mid);}
.topbar-logout{background:none;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:5px 12px;font-family:'Jost',sans-serif;font-size:0.76rem;cursor:pointer;color:var(--mid);}
.topbar-logout:hover{background:var(--surface2);}

/* TABS */
.tab-nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 20px;gap:2px;overflow-x:auto;}
.tab-btn{padding:12px 18px;font-family:'Jost',sans-serif;font-size:0.82rem;color:var(--mid);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap;}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--gold-dark);border-bottom-color:var(--gold);font-weight:500;}

/* CONTENT */
.tab-content{max-width:900px;margin:0 auto;padding:24px 20px;}

/* OVERVIEW */
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.cat-card-header{padding:14px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background 0.15s;}
.cat-card-header:hover{background:var(--surface2);}
.cat-emoji{font-size:1.1rem;width:28px;text-align:center;}
.cat-title{font-size:0.9rem;font-weight:500;flex:1;}
.cat-badge{font-size:0.7rem;padding:3px 10px;border-radius:20px;font-weight:500;}
.cat-badge.locked{background:var(--green-light);color:var(--green);}
.cat-badge.draft{background:var(--surface2);color:var(--mid);}
.cat-chevron{font-size:0.72rem;color:var(--light);transition:transform 0.2s;}
.cat-chevron.open{transform:rotate(180deg);}
.cat-body{display:none;border-top:1px solid var(--border);padding:14px 18px;background:var(--surface2);}
.cat-body.open{display:block;}

/* VENDOR CARDS */
.vendor-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:8px;}
.vendor-card-name{font-weight:500;font-size:0.9rem;margin-bottom:4px;}
.vendor-card-meta{font-size:0.75rem;color:var(--light);margin-bottom:10px;}
.vendor-status{display:inline-block;font-size:0.7rem;padding:2px 9px;border-radius:20px;}
.vendor-status.booked{background:var(--green-light);color:var(--green);}
.vendor-status.suggested{background:var(--blue-light);color:var(--blue);}
.vendor-status.shortlisted{background:var(--gold-light);color:var(--gold-dark);}
.vendor-status.decided{background:var(--green-light);color:var(--green);}

/* HEARTS RATING */
.hearts{display:flex;gap:3px;margin-top:8px;}
.heart{font-size:1.1rem;cursor:pointer;color:var(--border-strong);transition:color 0.15s;}
.heart.filled{color:var(--rose);}

/* NOTES */
.notes-area{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 12px;font-family:'Jost',sans-serif;font-size:0.82rem;resize:vertical;background:var(--bg);outline:none;min-height:70px;margin-top:8px;}
.notes-area:focus{border-color:var(--gold);}
.save-note-btn{margin-top:6px;background:var(--gold);color:#fff;border:none;border-radius:var(--radius-sm);padding:6px 14px;font-family:'Jost',sans-serif;font-size:0.78rem;cursor:pointer;}
.save-note-btn:hover{background:var(--gold-dark);}

/* BUDGET */
.budget-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.budget-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center;}
.budget-card .val{font-size:1.4rem;font-weight:500;}
.budget-card .lbl{font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--light);margin-top:2px;}
.budget-card.pending .val{color:var(--gold-dark);}
.budget-card.paid .val{color:var(--green);}
.budget-cat-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;overflow:hidden;}
.budget-cat-header{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background 0.15s;}
.budget-cat-header:hover{background:var(--surface2);}
.budget-cat-body{display:none;border-top:1px solid var(--border);background:var(--surface2);padding:10px 14px;}
.budget-cat-body.open{display:block;}
.budget-item-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:0.8rem;}
.budget-item-row:last-child{border-bottom:none;}

/* PAYMENTS */
.payment-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.8rem;}
.payment-row:last-child{border-bottom:none;}
.payment-status{font-size:0.7rem;padding:2px 8px;border-radius:10px;}
.payment-status.paid{background:var(--green-light);color:var(--green);}
.payment-status.pending{background:var(--gold-light);color:var(--gold-dark);}

/* PLAN */
.month-group{margin-bottom:22px;}
.month-label{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-style:italic;color:var(--gold-dark);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.plan-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.plan-item:last-child{border-bottom:none;}
.plan-check{width:19px;height:19px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.65rem;}
.plan-check.done{background:var(--green);border-color:var(--green);color:#fff;}
.plan-title{font-size:0.84rem;flex:1;}
.plan-title.done{text-decoration:line-through;color:var(--light);}
.plan-date{font-size:0.73rem;color:var(--light);}
.plan-date.overdue{color:var(--rose);}

/* MEDIA */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.media-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;transition:all 0.15s;}
.media-card:hover{border-color:var(--gold);box-shadow:var(--shadow);}

/* CHAT */
.chat-wrap{display:flex;height:calc(100vh - 300px);min-height:400px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.chat-sidebar{width:230px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;}
.chat-area{flex:1;display:flex;flex-direction:column;background:var(--surface);}
.chat-thread-item{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.15s;}
.chat-thread-item:hover,.chat-thread-item.active{background:var(--gold-light);}
.chat-thread-name{font-size:0.82rem;font-weight:500;}
.chat-vendor-item{padding:7px 13px 7px 24px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.15s;}
.chat-vendor-item:hover,.chat-vendor-item.active{background:var(--gold-light);}
.chat-vendor-name{font-size:0.78rem;color:var(--mid);}
.chat-header{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:500;font-size:0.88rem;}
.chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.chat-msg{max-width:68%;padding:9px 13px;border-radius:12px;font-size:0.82rem;line-height:1.5;}
.chat-msg.planner{background:var(--gold-light);border:1px solid var(--border);align-self:flex-start;}
.chat-msg.couple{background:var(--blue-light);border:1px solid rgba(90,122,154,0.2);align-self:flex-end;}
.chat-msg-meta{font-size:0.68rem;color:var(--light);margin-top:3px;}
.chat-input-wrap{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;}
.chat-input-wrap input{flex:1;border:1px solid var(--border-strong);border-radius:20px;padding:8px 15px;font-family:'Jost',sans-serif;font-size:0.82rem;background:var(--bg);outline:none;}
.chat-input-wrap input:focus{border-color:var(--gold);}
.chat-send{background:var(--gold);color:#fff;border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chat-send:hover{background:var(--gold-dark);}

/* MISC */
.empty-state{text-align:center;padding:40px 20px;color:var(--light);}
.empty-state .icon{font-size:2.5rem;margin-bottom:10px;opacity:0.4;}
#toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;border-radius:var(--radius-sm);padding:10px 17px;font-size:0.82rem;z-index:9999;transform:translateY(60px);opacity:0;transition:all 0.3s;max-width:320px;}
#toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">My Greek Wedding</div>
  <div class="login-sub">Your Wedding Portal</div>
  <div class="login-box">
    <input type="email" id="l-email" placeholder="Your email address" onkeydown="if(event.key==='Enter')doLogin()"/>
    <input type="password" id="l-pass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button onclick="doLogin()">Enter Your Portal</button>
    <div class="login-err" id="l-err">Incorrect email or password</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- HERO -->
  <div class="hero">
    <div class="hero-content">
      <div class="hero-names" id="hero-names">Sarah & James</div>
      <div class="hero-date" id="hero-date">Your Wedding Day</div>
      <div class="hero-countdown" id="hero-countdown"></div>
      <div class="hero-location" id="hero-location"></div>
    </div>
  </div>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-logo">My Greek Wedding</div>
    <div class="topbar-user" id="topbar-user"></div>
    <button class="topbar-logout" onclick="logout()">Log out</button>
  </div>

  <!-- TABS -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('overview',this)">♥ Overview</button>
    <button class="tab-btn" onclick="switchTab('budget',this)">💰 Budget</button>
    <button class="tab-btn" onclick="switchTab('plan',this)">📋 Plan</button>
    <button class="tab-btn" onclick="switchTab('media',this)">🖼 Media</button>
    <button class="tab-btn" onclick="switchTab('chat',this)">💬 Chat</button>
  </div>

  <div class="tab-content" id="tab-content">
    <div class="empty-state"><div class="icon">🌸</div><p>Loading your wedding portal…</p></div>
  </div>
</div>

<div id="toast"></div>

<script>
const SB_URL = 'https://bfslgaalktrgtbxwbdlv.supabase.co';
const SB_KEY = 'sb_publishable_DZt4P67RcstQs7i7fktNeA_iuh9MXnJ';

const CATS = [
  {key:'wedding_planning',label:'Wedding Planning',emoji:'💍'},
  {key:'venue',label:'Venue',emoji:'🏛'},
  {key:'officiants',label:'Officiants / Celebrant',emoji:'📜'},
  {key:'photography',label:'Photography',emoji:'📸'},
  {key:'videography',label:'Videography',emoji:'🎬'},
  {key:'hair',label:'Hair',emoji:'💇'},
  {key:'makeup',label:'Makeup',emoji:'💄'},
  {key:'flowers',label:'Florist',emoji:'🌸'},
  {key:'sound_light',label:'Sound & Lighting',emoji:'🔊'},
  {key:'dj',label:'DJ',emoji:'🎵'},
  {key:'band',label:'Band',emoji:'🎸'},
  {key:'photo_booth',label:'Photobooth',emoji:'📷'},
  {key:'pastries',label:'Pastries & Cake',emoji:'🎂'},
  {key:'rentals',label:'Rentals',emoji:'🪑'},
  {key:'printing',label:'Printing / Stationery',emoji:'🖨'},
  {key:'transportation',label:'Transportation',emoji:'🚗'},
  {key:'fireworks',label:'Fireworks',emoji:'🎆'},
  {key:'food',label:'Catering',emoji:'🍽'},
  {key:'bar',label:'Bar',emoji:'🍷'},
  {key:'yacht',label:'Yacht',emoji:'⛵'},
  {key:'favors',label:'Favors',emoji:'🎁'},
];

const S = {couple:null, coupleVendors:[], tasks:[], budgetItems:[], mediaFiles:[], payments:[], vendorCache:{}, currentThread:null, chatExpanded:{}, currentTab:'overview'};

async function sbGet(table, qs='') {
  const r = await fetch(`${SB_URL}/rest/v1/${table}${qs?'?'+qs:''}`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Accept':'application/json'}});
  const t = await r.text(); if(!r.ok) throw new Error(t); return JSON.parse(t);
}
async function sbPost(table, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(data)});
  const t = await r.text(); if(!r.ok) throw new Error(t); return JSON.parse(t);
}
async function sbPatch(table, filter, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${filter}`,{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(data)});
  const t = await r.text(); if(!r.ok) throw new Error(t); return JSON.parse(t);
}

// ── LOGIN ─────────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('l-email').value.trim().toLowerCase();
  const pass = document.getElementById('l-pass').value;
  if(!email||!pass){showErr('Enter email and password');return;}
  try {
    const res = await sbGet('couples',`email=eq.${encodeURIComponent(email)}&password_hash=eq.${encodeURIComponent(pass)}&select=*`);
    if(!res.length){showErr('Incorrect email or password');return;}
    S.couple = res[0];
    localStorage.setItem('mgw_couple_id', S.couple.id);
    enterPortal();
  } catch(e){showErr('Error: '+e.message);}
}
function showErr(msg){const e=document.getElementById('l-err');e.textContent=msg;e.style.display='block';setTimeout(()=>e.style.display='none',3000);}

async function enterPortal() {
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('app').style.flexDirection='column';
  renderHero();
  await loadData();
  switchTabDirect('overview');
}

function renderHero() {
  const c = S.couple;
  document.getElementById('hero-names').textContent = `${c.partner1_name} & ${c.partner2_name}`;
  document.getElementById('topbar-user').textContent = `${c.partner1_name} & ${c.partner2_name}`;
  if(c.wedding_date) {
    const wd = new Date(c.wedding_date);
    document.getElementById('hero-date').textContent = wd.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    updateCountdown(wd);
    setInterval(()=>updateCountdown(wd), 60000);
  }
  if(c.wedding_location) document.getElementById('hero-location').textContent = '📍 '+c.wedding_location;
}

function updateCountdown(wd) {
  const now = new Date();
  const diff = wd - now;
  if(diff <= 0) { document.getElementById('hero-countdown').innerHTML = `<div style="color:var(--gold);font-size:1.1rem;font-family:'Cormorant Garamond',serif;font-style:italic">Your wedding day has arrived! 🎉</div>`; return; }
  const days = Math.floor(diff/86400000);
  const hours = Math.floor((diff%86400000)/3600000);
  const mins = Math.floor((diff%3600000)/60000);
  document.getElementById('hero-countdown').innerHTML = `
    <div class="countdown-item"><div class="countdown-num">${days}</div><div class="countdown-label">Days</div></div>
    <div class="countdown-item"><div class="countdown-num">${hours}</div><div class="countdown-label">Hours</div></div>
    <div class="countdown-item"><div class="countdown-num">${mins}</div><div class="countdown-label">Minutes</div></div>`;
}

async function loadData() {
  const id = S.couple.id;
  try {
    [S.coupleVendors, S.tasks, S.budgetItems, S.mediaFiles, S.payments] = await Promise.all([
      sbGet('couple_vendors',`couple_id=eq.${id}&order=created_at.asc`).catch(()=>[]),
      sbGet('tasks',`couple_id=eq.${id}&order=due_date.asc`).catch(()=>[]),
      sbGet('budget_items',`couple_id=eq.${id}&order=sort_order.asc`).catch(()=>[]),
      sbGet('media_files',`couple_id=eq.${id}&visible_to_couple=eq.true&order=created_at.desc`).catch(()=>[]),
      sbGet('payments',`couple_id=eq.${id}&order=due_date.asc`).catch(()=>[]),
    ]);
    // Resolve vendor names
    const ids = [...new Set(S.coupleVendors.map(v=>v.vendor_id).filter(v=>v&&!S.vendorCache[v]))];
    for(const vid of ids) {
      try {
        const res = await sbGet('vendors',`id=eq.${encodeURIComponent(vid)}&select=id,name,category,region,price_range,contact`);
        if(res&&res[0]) S.vendorCache[vid]=res[0];
      } catch(e){}
    }
  } catch(e){toast('Error loading data: '+e.message);}
}

function logout() {
  localStorage.removeItem('mgw_couple_id');
  location.reload();
}

// ── TABS ──────────────────────────────────────────────────────────
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  switchTabDirect(tab);
}
function switchTabDirect(tab) {
  S.currentTab = tab;
  const el = document.getElementById('tab-content');
  if(tab==='overview') el.innerHTML = buildOverview();
  else if(tab==='budget') el.innerHTML = buildBudget();
  else if(tab==='plan') el.innerHTML = buildPlan();
  else if(tab==='media') el.innerHTML = buildMedia();
  else if(tab==='chat') { el.innerHTML = buildChat(); initChat(); }
}

// ── OVERVIEW ──────────────────────────────────────────────────────
function buildOverview() {
  let h = `<div style="margin-bottom:20px"><div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.6rem;margin-bottom:4px">Your Wedding Overview</div>
    <div style="font-size:0.82rem;color:var(--light)">Review your vendors and share your thoughts with Niovi</div></div>`;

  // Only show categories that have visible vendors
  const activeCats = CATS.filter(cat =>
    S.coupleVendors.some(cv => cv.category===cat.key && cv.visible_to_couple!==false)
  );

  if(!activeCats.length) {
    return h + `<div class="empty-state"><div class="icon">💍</div><p>Niovi hasn't added any vendors yet — check back soon!</p></div>`;
  }

  activeCats.forEach(cat => {
    const cvs = S.coupleVendors.filter(cv=>cv.category===cat.key && cv.visible_to_couple!==false);
    const locked = cvs.find(cv=>cv.status==='booked');

    h += `<div class="cat-card">
      <div class="cat-card-header" onclick="toggleCat(this)">
        <span class="cat-emoji">${cat.emoji}</span>
        <span class="cat-title">${cat.label}</span>
        <span class="cat-badge ${locked?'locked':'draft'}">${locked?'🔒 Confirmed':'In Progress'}</span>
        <span class="cat-chevron">▾</span>
      </div>
      <div class="cat-body">
        ${cvs.map(cv=>{
          const v = S.vendorCache[cv.vendor_id];
          const name = v?v.name:'Vendor';
          const region = v?.region||'';
          const isLocked = cv.status==='booked';
          return `<div class="vendor-card">
            <div style="display:flex;align-items:flex-start;justify-content:space-between">
              <div>
                <div class="vendor-card-name">${name}${isLocked?' 🔒':''}</div>
                <div class="vendor-card-meta">${region}</div>
                <span class="vendor-status ${cv.status}">${isLocked?'Confirmed':cv.status}</span>
              </div>
            </div>
            <div style="margin-top:10px">
              <div style="font-size:0.72rem;color:var(--light);margin-bottom:4px;letter-spacing:0.06em;text-transform:uppercase">Your Rating</div>
              <div class="hearts" id="hearts-${cv.id}">
                ${[1,2,3,4,5].map(i=>`<span class="heart ${i<=(cv.rating||0)?'filled':''}" onmousedown="rateVendor('${cv.id}',${i})">♥</span>`).join('')}
              </div>
            </div>
            <div style="margin-top:10px">
              <div style="font-size:0.72rem;color:var(--light);margin-bottom:4px;letter-spacing:0.06em;text-transform:uppercase">Your Notes</div>
              <textarea class="notes-area" id="notes-${cv.id}" placeholder="Add your thoughts about this vendor…">${cv.couple_notes||''}</textarea>
              <button class="save-note-btn" onclick="saveNote('${cv.id}')">Save Note</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });
  return h;
}

function toggleCat(header) {
  const body = header.nextElementSibling;
  const chev = header.querySelector('.cat-chevron');
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

async function rateVendor(cvId, rating) {
  const cv = S.coupleVendors.find(c=>c.id===cvId);
  if(!cv) return;
  cv.rating = rating;
  await sbPatch('couple_vendors',`id=eq.${cvId}`,{rating}).catch(e=>toast('Error: '+e.message));
  const el = document.getElementById('hearts-'+cvId);
  if(el) el.innerHTML = [1,2,3,4,5].map(i=>`<span class="heart ${i<=rating?'filled':''}" onmousedown="rateVendor('${cvId}',${i})">♥</span>`).join('');
  toast('Rating saved! ✓');
}

async function saveNote(cvId) {
  const note = document.getElementById('notes-'+cvId)?.value;
  const cv = S.coupleVendors.find(c=>c.id===cvId);
  if(!cv) return;
  cv.couple_notes = note;
  await sbPatch('couple_vendors',`id=eq.${cvId}`,{couple_notes:note}).catch(e=>toast('Error: '+e.message));
  toast('Note saved! ✓');
}

// ── BUDGET ────────────────────────────────────────────────────────
function calcItemTotal(b) {
  const guests = Number(S.couple.guest_count||0);
  const price = Number(b.item_price||0);
  const perHead = b.pricing_type==='per_head';
  const base = perHead ? (Number(b.guests||0)||guests) * price : price;
  const vat = base * (Number(b.vat_amount||0)/100);
  return {base, vat, total: base+vat};
}

function buildBudget() {
  let totPaid=0, totActual=0;
  S.budgetItems.forEach(b=>{ const {total}=calcItemTotal(b); totActual+=total; });
  totPaid = (S.payments||[]).filter(p=>p.status==='paid').reduce((a,p)=>a+Number(p.amount||0)*(1+Number(p.vat_rate||0)/100),0);
  const totPend = totActual - totPaid;
  const goal = Number(S.couple.budget_goal||0);

  let h = `<div style="margin-bottom:20px"><div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.6rem;margin-bottom:4px">Your Wedding Budget</div></div>
  <div class="budget-summary">
    <div class="budget-card pending"><div class="val">€${Math.round(totPend).toLocaleString()}</div><div class="lbl">Pending</div></div>
    <div class="budget-card paid"><div class="val">€${Math.round(totPaid).toLocaleString()}</div><div class="lbl">Paid</div></div>
    <div class="budget-card"><div class="val">€${goal.toLocaleString()}</div><div class="lbl">Goal</div></div>
  </div>`;

  // Categories with items
  CATS.forEach(cat=>{
    const items = S.budgetItems.filter(b=>b.category===cat.key);
    if(!items.length) return;
    let catTotal=0;
    items.forEach(b=>{ catTotal+=calcItemTotal(b).total; });

    h+=`<div class="budget-cat-row">
      <div class="budget-cat-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <span style="font-size:1rem">${cat.emoji}</span>
        <span style="font-size:0.86rem;font-weight:500;flex:1">${cat.label}</span>
        <span style="font-size:0.84rem;font-weight:500;color:var(--gold-dark)">€${Math.round(catTotal).toLocaleString()}</span>
        <span style="color:var(--light);font-size:0.72rem;margin-left:8px">▾</span>
      </div>
      <div class="budget-cat-body">
        ${items.map(b=>{
          const {base,vat,total}=calcItemTotal(b);
          const perHead=b.pricing_type==='per_head';
          const guests=Number(b.guests||S.couple.guest_count||0);
          return `<div class="budget-item-row">
            <span style="flex:1;color:var(--mid)">${b.item_name}</span>
            <span style="font-size:0.72rem;color:var(--light)">${perHead?`${guests}×€${Number(b.item_price).toLocaleString()}`:'Fixed'}</span>
            ${vat?`<span style="font-size:0.72rem;color:var(--light)">+${b.vat_amount}% VAT</span>`:''}
            <span style="font-weight:500">€${Math.round(total).toLocaleString()}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });

  // Payments section
  const payments = S.payments||[];
  if(payments.length) {
    h+=`<div style="margin-top:20px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.3rem;margin-bottom:12px">Payment Schedule</div>`;
    const pending = payments.filter(p=>p.status!=='paid');
    const paid = payments.filter(p=>p.status==='paid');

    if(pending.length) {
      h+=`<div style="font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--mid);margin-bottom:8px">Upcoming Payments</div>`;
      h+=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:14px">`;
      pending.forEach(p=>{
        const total = Number(p.amount||0)*(1+Number(p.vat_rate||0)/100);
        h+=`<div class="payment-row">
          <span>${p.method==='bank'?'🏦':'💵'}</span>
          <span style="flex:1">${p.description||'Payment'}</span>
          ${p.due_date?`<span style="font-size:0.72rem;color:var(--light)">Due ${new Date(p.due_date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</span>`:''}
          <span style="font-weight:500;color:var(--gold-dark)">€${Math.round(total).toLocaleString()}</span>
          <span class="payment-status pending">Pending</span>
        </div>`;
      });
      h+=`</div>`;
    }
    if(paid.length) {
      h+=`<div style="font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--mid);margin-bottom:8px">Paid</div>`;
      h+=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;">`;
      paid.forEach(p=>{
        const total = Number(p.amount||0)*(1+Number(p.vat_rate||0)/100);
        h+=`<div class="payment-row">
          <span>${p.method==='bank'?'🏦':'💵'}</span>
          <span style="flex:1">${p.description||'Payment'}</span>
          ${p.paid_date?`<span style="font-size:0.72rem;color:var(--green)">Paid ${new Date(p.paid_date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</span>`:''}
          <span style="font-weight:500;color:var(--green)">€${Math.round(total).toLocaleString()}</span>
          <span class="payment-status paid">✓ Paid</span>
        </div>`;
      });
      h+=`</div>`;
    }
  }
  return h;
}

// ── PLAN ──────────────────────────────────────────────────────────
function buildPlan() {
  let h=`<div style="margin-bottom:20px"><div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.6rem;margin-bottom:4px">Your Wedding Plan</div>
    <div style="font-size:0.82rem;color:var(--light)">Tasks and milestones for your big day</div></div>`;
  const tasks=[...S.tasks].sort((a,b)=>(a.due_date||'9999')>(b.due_date||'9999')?1:-1);
  if(!tasks.length) return h+`<div class="empty-state"><div class="icon">📋</div><p>No tasks yet — Niovi will add them soon!</p></div>`;
  const groups={};
  tasks.forEach(t=>{const k=t.due_date?t.due_date.slice(0,7):'no-date';(groups[k]=groups[k]||[]).push(t);});
  Object.entries(groups).forEach(([k,gt])=>{
    const label=k==='no-date'?'No Date':new Date(k+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    h+=`<div class="month-group"><div class="month-label">${label}</div>`;
    gt.forEach(t=>{
      const od=t.due_date&&!t.completed&&new Date(t.due_date)<new Date();
      h+=`<div class="plan-item">
        <div class="plan-check ${t.completed?'done':''}" onclick="toggleTask('${t.id}',${!!t.completed})">${t.completed?'✓':''}</div>
        <div class="plan-title ${t.completed?'done':''}">${t.title}</div>
        <div class="plan-date ${od?'overdue':''}">${t.due_date?new Date(t.due_date).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):''} ${od?'⚠️':''}</div>
      </div>`;
    });
    h+=`</div>`;
  });
  return h;
}

async function toggleTask(id, done) {
  const t=S.tasks.find(t=>t.id===id);
  if(!t)return;
  t.completed=!done;
  await sbPatch('tasks',`id=eq.${id}`,{completed:!done,completed_at:!done?new Date().toISOString():null}).catch(e=>toast('Error: '+e.message));
  switchTabDirect('plan');
}

// ── MEDIA ──────────────────────────────────────────────────────────
function buildMedia() {
  const icons={contract:'📄',invoice:'🧾',proof_of_payment:'✅',offer:'📋',photo:'🖼',other:'📎'};
  let h=`<div style="margin-bottom:20px"><div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.6rem;margin-bottom:4px">Documents & Media</div>
    <div style="font-size:0.82rem;color:var(--light)">Files shared with you by Niovi</div></div>`;
  if(!S.mediaFiles.length) return h+`<div class="empty-state"><div class="icon">🖼</div><p>No files shared yet</p></div>`;
  h+=`<div class="media-grid">${S.mediaFiles.map(f=>`
    <div class="media-card">
      <div style="font-size:1.8rem;margin-bottom:7px">${icons[f.file_type]||'📎'}</div>
      <div style="font-size:0.8rem;font-weight:500;word-break:break-all;margin-bottom:4px">${f.file_name}</div>
      <div style="font-size:0.7rem;color:var(--light);margin-bottom:8px">${f.file_type?.replace(/_/g,' ')||'file'} · ${new Date(f.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div>
      <a href="${f.file_url}" target="_blank" style="font-size:0.75rem;color:var(--gold-dark);text-decoration:none;border:1px solid var(--border-strong);padding:4px 10px;border-radius:var(--radius-sm)">⬇ View / Download</a>
    </div>`).join('')}</div>`;
  return h;
}

// ── CHAT ──────────────────────────────────────────────────────────
function buildChat() {
  return `<div class="chat-wrap">
    <div class="chat-sidebar">
      <div style="padding:10px 12px;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--light);border-bottom:1px solid var(--border)">Messages</div>
      <div id="thread-list"></div>
    </div>
    <div class="chat-area">
      <div class="chat-header" id="chat-hd">Select a thread</div>
      <div class="chat-messages" id="chat-msgs"><div style="margin:auto;color:var(--light);font-size:0.82rem">Select a thread to start chatting</div></div>
      <div class="chat-input-wrap" id="chat-input-wrap" style="display:none">
        <input id="chat-in" placeholder="Type a message to Niovi…" onkeydown="if(event.key==='Enter')sendMsg()"/>
        <button class="chat-send" onclick="sendMsg()">➤</button>
      </div>
    </div>
  </div>`;
}

function initChat() {
  const el=document.getElementById('thread-list');
  if(!el) return;
  let h=`<div class="chat-thread-item" onclick="selectThread('general',null,'💬 General Chat')">
    <div class="chat-thread-name">💬 General Chat</div>
  </div>`;
  CATS.forEach(cat=>{
    const cvs=S.coupleVendors.filter(cv=>cv.category===cat.key&&cv.visible_to_couple!==false);
    if(!cvs.length) return;
    const isExp=S.chatExpanded[cat.key];
    const isCatActive=S.currentThread?.catKey===cat.key&&!S.currentThread?.vendorId;
    h+=`<div class="chat-thread-item ${isCatActive?'active':''}" style="display:flex;align-items:center;padding:0">
      <div style="flex:1;padding:9px 13px;cursor:pointer" onclick="selectThread('${cat.key}',null,'${cat.emoji} ${cat.label}')">
        <div class="chat-thread-name">${cat.emoji} ${cat.label}</div>
      </div>
      <div style="padding:9px 10px;cursor:pointer;color:var(--light);font-size:0.72rem;transform:${isExp?'rotate(90deg)':'rotate(0)'}" onclick="toggleChatCat('${cat.key}')">▶</div>
    </div>`;
    if(isExp) cvs.forEach(cv=>{
      const v=S.vendorCache[cv.vendor_id];
      if(!v) return;
      const isVA=S.currentThread?.vendorId===cv.vendor_id;
      h+=`<div class="chat-vendor-item ${isVA?'active':''}" onclick="selectThread('${cat.key}','${cv.vendor_id}','${v.name.replace(/'/g,"\\'")}')">
        <div class="chat-vendor-name">› ${v.name}</div>
      </div>`;
    });
  });
  el.innerHTML=h;
}

function toggleChatCat(k){S.chatExpanded[k]=!S.chatExpanded[k];initChat();}

async function selectThread(catKey,vendorId,title){
  S.currentThread={catKey,vendorId};
  document.getElementById('chat-hd').textContent=title||catKey;
  document.getElementById('chat-input-wrap').style.display='flex';
  initChat();
  try {
    const cat=vendorId?`${catKey}_${vendorId}`:catKey;
    const msgs=await sbGet('messages',`couple_id=eq.${S.couple.id}&category=eq.${encodeURIComponent(cat)}&order=created_at.asc`);
    // Mark as read
    if(msgs.some(m=>!m.read_by_couple)) {
      await fetch(`${SB_URL}/rest/v1/messages?couple_id=eq.${S.couple.id}&category=eq.${encodeURIComponent(cat)}&read_by_couple=eq.false`,{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({read_by_couple:true})}).catch(()=>{});
    }
    renderMsgs(msgs);
  } catch(e){toast('Error: '+e.message);}
}

function renderMsgs(msgs){
  const el=document.getElementById('chat-msgs');
  if(!el)return;
  if(!msgs.length){el.innerHTML='<div style="margin:auto;color:var(--light);font-size:0.82rem">No messages yet — start the conversation!</div>';return;}
  el.innerHTML=msgs.map(m=>{
    const isCouple=m.sender==='couple';
    const time=new Date(m.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    return `<div style="display:flex;flex-direction:column;align-items:${isCouple?'flex-end':'flex-start'}">
      <div class="chat-msg ${m.sender}">${m.content}</div>
      <div class="chat-msg-meta" style="text-align:${isCouple?'right':'left'}">${m.sender_name||m.sender} · ${time}</div>
    </div>`;
  }).join('');
  el.scrollTop=el.scrollHeight;
}

async function sendMsg(){
  const inp=document.getElementById('chat-in');
  const content=inp.value.trim();
  if(!content||!S.currentThread)return;
  const {catKey,vendorId}=S.currentThread;
  const category=vendorId?`${catKey}_${vendorId}`:catKey;
  const name=`${S.couple.partner1_name} & ${S.couple.partner2_name}`;
  try {
    await sbPost('messages',{couple_id:S.couple.id,sender:'couple',sender_name:name,content,category,read_by_couple:true,read_by_planner:false});
    inp.value='';
    const msgs=await sbGet('messages',`couple_id=eq.${S.couple.id}&category=eq.${encodeURIComponent(category)}&order=created_at.asc`);
    renderMsgs(msgs);
  } catch(e){toast('Error: '+e.message);}
}

// ── TOAST ──────────────────────────────────────────────────────────
function toast(msg,dur=2500){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='show';
  clearTimeout(el._t); el._t=setTimeout(()=>el.className='',dur);
}

// ── INIT ──────────────────────────────────────────────────────────
// Auto-login if session exists
const savedId = localStorage.getItem('mgw_couple_id');
if(savedId) {
  (async()=>{
    try {
      const res = await sbGet('couples',`id=eq.${savedId}&select=*`);
      if(res&&res[0]){S.couple=res[0];enterPortal();}
    } catch(e){}
  })();
}
</script>
