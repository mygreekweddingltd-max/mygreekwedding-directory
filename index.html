<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Greek Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Jost',sans-serif;font-weight:300;background:#FDFAF5;color:#1A1714;min-height:100vh;display:flex;flex-direction:column;}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;background:linear-gradient(135deg,#1A1714 0%,#2D2520 60%,#1A1714 100%);position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23C9A96E' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");}
.hero-content{position:relative;z-index:1;max-width:600px;}
.logo{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:3.2rem;color:#C9A96E;letter-spacing:0.02em;margin-bottom:12px;}
.tagline{font-size:0.85rem;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:48px;}
.divider{width:60px;height:1px;background:#C9A96E;margin:0 auto 48px;opacity:0.4;}
.cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(201,169,110,0.25);border-radius:16px;padding:32px 28px;width:220px;cursor:pointer;transition:all 0.25s;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:12px;}
.card:hover{background:rgba(201,169,110,0.1);border-color:rgba(201,169,110,0.5);transform:translateY(-3px);}
.card-icon{font-size:2rem;}
.card-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.3rem;color:#C9A96E;}
.card-desc{font-size:0.75rem;color:rgba(255,255,255,0.4);text-align:center;line-height:1.5;}
.footer{padding:20px;text-align:center;font-size:0.72rem;color:#A09080;letter-spacing:0.06em;}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-content">
    <div class="logo">My Greek Wedding</div>
    <div class="tagline">Crafting unforgettable celebrations in Greece</div>
    <div class="divider"></div>
    <div class="cards">
      <a href="/portal" class="card">
        <div class="card-icon">💍</div>
        <div class="card-title">Couple Portal</div>
        <div class="card-desc">Access your wedding dashboard, vendors & chat with Niovi</div>
      </a>
      <a href="/planner" class="card">
        <div class="card-icon">🗂</div>
        <div class="card-title">Planner Login</div>
        <div class="card-desc">Planner access only</div>
      </a>
    </div>
  </div>
</div>
<div class="footer">© 2025 My Greek Wedding · All rights reserved</div>
</body>
</html>
