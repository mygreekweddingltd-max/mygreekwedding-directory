<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MGW Planner — My Greek Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #FDFAF5;
  --surface: #FFFFFF;
  --surface2: #F5F0E8;
  --ink: #1A1714;
  --mid: #6B6052;
  --light: #A09080;
  --gold: #C9A96E;
  --gold-light: #F0E6D3;
  --gold-dark: #A8864A;
  --rose: #C97A7A;
  --rose-light: #F5E8E8;
  --green: #5A8A5A;
  --green-light: #E8F2E8;
  --blue: #5A7A9A;
  --blue-light: #E8EFF5;
  --border: rgba(201,169,110,0.2);
  --border-strong: rgba(201,169,110,0.35);
  --shadow: 0 2px 20px rgba(26,23,20,0.08);
  --shadow-lg: 0 8px 40px rgba(26,23,20,0.12);
  --radius: 14px;
  --radius-sm: 9px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Jost',sans-serif;font-weight:300;background:var(--bg);color:var(--ink);min-height:100vh;}

/* ── PASSWORD SCREEN ── */
#pw-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:24px;}
.pw-logo{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2.4rem;color:var(--gold);letter-spacing:0.02em;}
.pw-sub{font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--light);}
.pw-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:32px 40px;display:flex;flex-direction:column;gap:16px;width:320px;box-shadow:var(--shadow);}
.pw-box input{border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:10px 14px;font-family:'Jost',sans-serif;font-size:0.9rem;outline:none;background:var(--bg);width:100%;}
.pw-box input:focus{border-color:var(--gold);}
.pw-box button{background:var(--gold);color:#fff;border:none;border-radius:var(--radius-sm);padding:11px;font-family:'Jost',sans-serif;font-weight:500;font-size:0.9rem;cursor:pointer;transition:background 0.2s;}
.pw-box button:hover{background:var(--gold-dark);}
.pw-err{color:var(--rose);font-size:0.8rem;text-align:center;display:none;}

/* ── MAIN LAYOUT ── */
#app{display:none;height:100vh;overflow:hidden;flex-direction:column;}

/* ── TOP BAR ── */
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;}
.topbar-logo{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:1.4rem;flex:1;}
.topbar-couple-selector{position:relative;}
.topbar-couple-selector select{border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:7px 32px 7px 12px;font-family:'Jost',sans-serif;font-size:0.85rem;background:var(--bg);color:var(--ink);cursor:pointer;outline:none;appearance:none;}
.topbar-couple-selector::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mid);pointer-events:none;font-size:0.75rem;}
.topbar-badge{background:var(--rose-light);color:var(--rose);border-radius:20px;padding:3px 10px;font-size:0.75rem;}
.topbar-btn{background:var(--gold);color:#fff;border:none;border-radius:var(--radius-sm);padding:7px 14px;font-family:'Jost',sans-serif;font-size:0.8rem;font-weight:500;cursor:pointer;transition:background 0.2s;}
.topbar-btn:hover{background:var(--gold-dark);}
.topbar-btn.outline{background:transparent;color:var(--gold);border:1px solid var(--border-strong);}
.topbar-btn.outline:hover{background:var(--gold-light);}

/* ── BODY LAYOUT ── */
.body-wrap{display:flex;flex:1;overflow:hidden;}

/* ── LEFT SIDEBAR: couples list ── */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.sidebar-header{padding:16px;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--light);border-bottom:1px solid var(--border);}
.couple-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.15s;}
.couple-item:hover{background:var(--gold-light);}
.couple-item.active{background:var(--gold-light);border-left:3px solid var(--gold);}
.couple-name{font-weight:500;font-size:0.88rem;color:var(--ink);}
.couple-date{font-size:0.75rem;color:var(--light);margin-top:2px;}
.couple-add{padding:12px 16px;color:var(--gold);font-size:0.82rem;cursor:pointer;display:flex;align-items:center;gap:6px;}
.couple-add:hover{background:var(--gold-light);}

/* ── MAIN PANEL ── */
.main-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* ── TAB NAV ── */
.tab-nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 24px;gap:4px;flex-shrink:0;}
.tab-btn{padding:14px 20px;font-family:'Jost',sans-serif;font-size:0.82rem;font-weight:400;color:var(--mid);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;display:flex;align-items:center;gap:6px;}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--gold-dark);border-bottom-color:var(--gold);font-weight:500;}

/* ── TAB CONTENT ── */
.tab-content{flex:1;overflow-y:auto;padding:24px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── COUPLE HEADER ── */
.couple-header{background:var(--surface);border-radius:var(--radius);padding:20px 24px;border:1px solid var(--border);margin-bottom:20px;display:flex;align-items:center;gap:24px;}
.couple-header-name{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-style:italic;color:var(--ink);}
.couple-header-detail{font-size:0.82rem;color:var(--light);margin-top:2px;}
.couple-header-stats{margin-left:auto;display:flex;gap:24px;}
.stat-item{text-align:center;}
.stat-val{font-size:1.3rem;font-weight:500;color:var(--gold-dark);}
.stat-label{font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--light);}

/* ── OVERVIEW TAB ── */
.overview-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.overview-toolbar h2{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-style:italic;flex:1;}
.btn-sm{border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:6px 14px;font-family:'Jost',sans-serif;font-size:0.78rem;cursor:pointer;background:transparent;color:var(--mid);transition:all 0.15s;}
.btn-sm:hover{background:var(--gold-light);color:var(--gold-dark);border-color:var(--gold);}
.btn-sm.primary{background:var(--gold);color:#fff;border-color:var(--gold);}
.btn-sm.primary:hover{background:var(--gold-dark);}

.category-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;}
.cat-row-header{display:flex;align-items:center;padding:12px 16px;cursor:pointer;gap:10px;transition:background 0.15s;}
.cat-row-header:hover{background:var(--surface2);}
.cat-emoji{width:28px;text-align:center;font-size:1.1rem;}
.cat-name{font-size:0.88rem;font-weight:500;flex:1;}
.cat-status{font-size:0.7rem;padding:2px 9px;border-radius:20px;font-weight:500;}
.cat-status.draft{background:#F0EDEA;color:var(--mid);}
.cat-status.decided{background:var(--green-light);color:var(--green);}
.cat-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
.cat-icon-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.85rem;transition:all 0.15s;color:var(--mid);}
.cat-icon-btn:hover{background:var(--gold-light);border-color:var(--gold);color:var(--gold-dark);}
.cat-chevron{font-size:0.75rem;color:var(--light);transition:transform 0.2s;}
.cat-chevron.open{transform:rotate(180deg);}
.cat-body{display:none;padding:0 16px 16px;background:var(--surface2);}
.cat-body.open{display:block;}

/* vendor chips in overview */
.vendor-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.vendor-chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:0.78rem;display:flex;align-items:center;gap:6px;cursor:pointer;}
.vendor-chip:hover{border-color:var(--gold);background:var(--gold-light);}
.chip-status{width:7px;height:7px;border-radius:50%;display:inline-block;}
.chip-status.suggested{background:var(--blue);}
.chip-status.shortlisted{background:var(--gold);}
.chip-status.decided{background:var(--green);}
.chip-status.booked{background:var(--green);}
.chip-status.rejected{background:var(--rose);}
.cat-no-vendors{font-size:0.8rem;color:var(--light);padding:12px 0;}

/* add vendor in overview */
.cat-add-vendor{margin-top:10px;}
.vendor-search-wrap{position:relative;}
.vendor-search-wrap input{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 12px;font-family:'Jost',sans-serif;font-size:0.82rem;background:var(--surface);outline:none;}
.vendor-search-wrap input:focus{border-color:var(--gold);}
.vendor-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);max-height:200px;overflow-y:auto;z-index:100;box-shadow:var(--shadow);}
.vendor-dd-item{padding:8px 12px;font-size:0.82rem;cursor:pointer;border-bottom:1px solid var(--border);}
.vendor-dd-item:hover{background:var(--gold-light);}
.vendor-dd-item:last-child{border-bottom:none;}

/* ── BUDGET TAB ── */
.budget-summary{display:flex;gap:12px;margin-bottom:20px;}
.budget-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 20px;flex:1;text-align:center;}
.budget-card .val{font-size:1.4rem;font-weight:500;}
.budget-card .lbl{font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--light);margin-top:2px;}
.budget-card.over .val{color:var(--rose);}
.budget-card.paid .val{color:var(--green);}
.budget-card.pending .val{color:var(--gold-dark);}

.budget-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;overflow:hidden;}
.budget-row-header{display:grid;grid-template-columns:1fr 100px 100px 100px 100px 36px;align-items:center;padding:12px 16px;gap:8px;cursor:pointer;}
.budget-row-header:hover{background:var(--surface2);}
.budget-col{text-align:right;font-size:0.82rem;}
.budget-col.name{text-align:left;font-weight:500;font-size:0.85rem;}
.budget-col.over{color:var(--rose);font-weight:500;}
.budget-col-label{text-align:right;font-size:0.7rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--light);padding:6px 16px;display:grid;grid-template-columns:1fr 100px 100px 100px 100px 36px;}
.budget-body{display:none;border-top:1px solid var(--border);background:var(--surface2);padding:12px 16px;}
.budget-body.open{display:block;}
.budget-item-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:0.8rem;}
.budget-item-row:last-child{border-bottom:none;}
.budget-item-name{color:var(--mid);}
.budget-item-val{text-align:right;font-size:0.82rem;}
.budget-commission{color:var(--green);font-size:0.75rem;}
.budget-add-item{display:flex;gap:8px;margin-top:12px;}
.budget-add-item input{flex:1;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:7px 10px;font-family:'Jost',sans-serif;font-size:0.8rem;background:var(--surface);outline:none;}
.budget-add-item input:focus{border-color:var(--gold);}

/* ── PLAN TAB ── */
.plan-toolbar{display:flex;gap:8px;margin-bottom:20px;align-items:center;}
.plan-subtab{padding:7px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);font-size:0.8rem;cursor:pointer;background:transparent;color:var(--mid);}
.plan-subtab.active{background:var(--gold);color:#fff;border-color:var(--gold);}
.month-group{margin-bottom:24px;}
.month-label{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-style:italic;color:var(--gold-dark);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.plan-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.plan-item:last-child{border-bottom:none;}
.plan-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.plan-check.done{background:var(--green);border-color:var(--green);color:#fff;font-size:0.7rem;}
.plan-check.payment{background:var(--gold-light);border-color:var(--gold);}
.plan-title{font-size:0.85rem;flex:1;}
.plan-title.done{text-decoration:line-through;color:var(--light);}
.plan-date{font-size:0.75rem;color:var(--light);}
.plan-date.overdue{color:var(--rose);}
.plan-amount{font-size:0.78rem;color:var(--gold-dark);margin-left:4px;}
.plan-bank{font-size:0.8rem;color:var(--mid);margin-left:4px;opacity:0.7;}

/* task form */
.task-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;}
.task-form input, .task-form select{border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 12px;font-family:'Jost',sans-serif;font-size:0.82rem;background:var(--bg);outline:none;flex:1;min-width:140px;}
.task-form input:focus, .task-form select:focus{border-color:var(--gold);}

/* ── MEDIA TAB ── */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.media-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:all 0.15s;}
.media-card:hover{border-color:var(--gold);box-shadow:var(--shadow);}
.media-icon{font-size:2rem;margin-bottom:8px;}
.media-name{font-size:0.8rem;font-weight:500;word-break:break-all;}
.media-meta{font-size:0.72rem;color:var(--light);margin-top:4px;}
.media-upload{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:32px;text-align:center;cursor:pointer;margin-bottom:20px;transition:all 0.2s;}
.media-upload:hover{border-color:var(--gold);background:var(--gold-light);}
.media-upload-icon{font-size:2rem;margin-bottom:8px;color:var(--light);}
.media-upload-text{font-size:0.85rem;color:var(--mid);}

/* ── CHAT TAB ── */
.chat-wrap{display:flex;height:calc(100vh - 220px);gap:0;}
.chat-sidebar{width:260px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius) 0 0 var(--radius);overflow-y:auto;flex-shrink:0;}
.chat-area{flex:1;background:var(--surface);border:1px solid var(--border);border-left:none;border-radius:0 var(--radius) var(--radius) 0;display:flex;flex-direction:column;}

.chat-thread-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.15s;}
.chat-thread-item:hover{background:var(--surface2);}
.chat-thread-item.active{background:var(--gold-light);}
.chat-thread-name{font-size:0.83rem;font-weight:500;}
.chat-thread-preview{font-size:0.75rem;color:var(--light);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-thread-time{font-size:0.7rem;color:var(--light);float:right;}
.chat-vendor-item{padding:8px 14px 8px 28px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.15s;}
.chat-vendor-item:hover{background:var(--surface2);}
.chat-vendor-item.active{background:var(--gold-light);}
.chat-vendor-name{font-size:0.8rem;color:var(--mid);}

.chat-header{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:500;font-size:0.9rem;display:flex;align-items:center;gap:8px;}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.chat-msg{max-width:70%;padding:10px 14px;border-radius:12px;font-size:0.84rem;line-height:1.5;}
.chat-msg.planner{background:var(--gold-light);border:1px solid var(--border);align-self:flex-start;}
.chat-msg.couple{background:var(--blue-light);border:1px solid rgba(90,122,154,0.2);align-self:flex-end;}
.chat-msg-meta{font-size:0.7rem;color:var(--light);margin-top:4px;}
.chat-input-wrap{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;}
.chat-input-wrap input{flex:1;border:1px solid var(--border-strong);border-radius:20px;padding:9px 16px;font-family:'Jost',sans-serif;font-size:0.84rem;background:var(--bg);outline:none;}
.chat-input-wrap input:focus{border-color:var(--gold);}
.chat-send{background:var(--gold);color:#fff;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chat-send:hover{background:var(--gold-dark);}

/* ── COUPLE MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(26,23,20,0.5);z-index:1000;display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius);width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-style:italic;}
.modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--mid);}
.modal-body{padding:24px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:0.75rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--mid);margin-bottom:5px;display:block;}
.form-input{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 12px;font-family:'Jost',sans-serif;font-size:0.88rem;background:var(--bg);outline:none;}
.form-input:focus{border-color:var(--gold);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--light);}
.empty-state .icon{font-size:3rem;margin-bottom:12px;opacity:0.5;}
.empty-state p{font-size:0.9rem;}

/* ── TOASTS ── */
#toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;border-radius:var(--radius-sm);padding:10px 18px;font-size:0.84rem;z-index:9999;transform:translateY(60px);opacity:0;transition:all 0.3s;}
#toast.show{transform:translateY(0);opacity:1;}

/* ── NO COUPLE SELECTED ── */
.no-couple{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--light);gap:12px;}
.no-couple .big{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-style:italic;color:var(--gold);}
</style>
</head>
<body>

<!-- PASSWORD -->
<div id="pw-screen">
  <div class="pw-logo">🌸 My Greek Wedding</div>
  <div class="pw-sub">Planner Dashboard</div>
  <div class="pw-box">
    <input type="password" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()"/>
    <button onclick="checkPw()">Enter</button>
    <div class="pw-err" id="pw-err">Incorrect password</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;flex-direction:column;height:100vh;">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-logo">🌸 My Greek Wedding</div>
    <span id="tb-unread" class="topbar-badge" style="display:none"></span>
    <button class="topbar-btn outline" onclick="openModal('add-couple-modal')">+ New Couple</button>
    <button class="topbar-btn" onclick="loadCouples()">↻ Refresh</button>
  </div>

  <div class="body-wrap">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">Couples (32)</div>
      <div id="couples-list">
        <div style="padding:20px;color:var(--light);font-size:0.82rem;">Loading couples…</div>
      </div>
      <div class="couple-add" onclick="openModal('add-couple-modal')">＋ Add couple</div>
    </div>

    <!-- MAIN PANEL -->
    <div class="main-panel">
      <!-- couple header -->
      <div id="couple-header-bar" style="padding:16px 24px 0;display:none;">
        <div class="couple-header" id="couple-header-content"></div>
      </div>

      <!-- TAB NAV -->
      <div class="tab-nav" id="tab-nav" style="display:none;">
        <button class="tab-btn active" onclick="switchTab('overview',this)">♥ Overview</button>
        <button class="tab-btn" onclick="switchTab('budget',this)">🐷 Budget</button>
        <button class="tab-btn" onclick="switchTab('plan',this)">📋 Plan</button>

<script>
const SB_URL = 'https://bfslgaalktrgtbxwbdlv.supabase.co';
const SB_KEY = 'sb_publishable_DZt4P67RcstQs7i7fktNeA_iuh9MXnJ';

const CATEGORIES = [
  {key:'wedding_planning', label:'Wedding Planning', emoji:'💍'},
  {key:'venue', label:'Venue', emoji:'🏛'},
  {key:'officiants', label:'Officiants/Celebrant', emoji:'📜'},

  {key:'bar', label:'Bar', emoji:'🍷'},
  {key:'yacht', label:'Yacht', emoji:'⛵'},
  {key:'favors', label:'Favors', emoji:'🎁'},
];

let state = {
  couples: [],
  currentCouple: null,
  coupleVendors: [],
  tasks: [],
  messages: [],
  budgetItems: [],
  mediaFiles: [],
  chatThreads: [],
  threadMessages: [],
  currentThread: null,
  vendorCache: {},
  currentTab: 'overview',
};

// ── API helpers ──────────────────────────────
async function sbGet(table, query='') {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${query}`, {
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}
  });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPost(table, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=representation'},
    body: JSON.stringify(data)
  });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPatch(table, filter, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${filter}`, {
    method:'PATCH',
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=representation'},
    body: JSON.stringify(data)
  });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(table, filter) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${filter}`, {
    method:'DELETE',
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}
  });
  if(!r.ok) throw new Error(await r.text());
}

// ── Password ─────────────────────────────────
function checkPw() {
  const v = document.getElementById('pw-input').value;
  if(v === 'Leenio') {
    document.getElementById('pw-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadCouples();
  } else {
    document.getElementById('pw-err').style.display = 'block';
    setTimeout(()=>document.getElementById('pw-err').style.display='none', 2000);
  }
}

// ── Load couples ──────────────────────────────
async function loadCouples() {
  try {
    state.couples = await sbGet('couples','order=wedding_date.asc');
    renderCoupleList();
  } catch(e) {
    toast('Error loading couples: ' + e.message);
  }
}

function renderCoupleList() {
  const el = document.getElementById('couples-list');
  if(!state.couples.length) {
    el.innerHTML = '<div style="padding:20px;color:var(--light);font-size:0.82rem;">No couples yet</div>';
    return;
  }
  el.innerHTML = state.couples.map(c => {
    const wd = c.wedding_date ? new Date(c.wedding_date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : 'Date TBD';
    const active = state.currentCouple?.id === c.id ? 'active' : '';
    return `<div class="couple-item ${active}" onclick="selectCouple('${c.id}')">
      <div class="couple-name">${c.partner1_name} & ${c.partner2_name}</div>
      <div class="couple-date">${wd} · ${c.wedding_location || '—'}</div>
    </div>`;
  }).join('');
}

async function selectCouple(id) {
  state.currentCouple = state.couples.find(c=>c.id===id);
  renderCoupleList();
  document.getElementById('couple-header-bar').style.display = 'block';
  document.getElementById('tab-nav').style.display = 'flex';
  renderCoupleHeader();
  await loadCoupleData();
  renderTab('overview');
  // activate overview btn
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{b.classList.toggle('active',i===0);});
}

function renderCoupleHeader() {
  const c = state.currentCouple;
  const wd = c.wedding_date ? new Date(c.wedding_date) : null;
  let days = wd ? Math.ceil((wd - new Date()) / 86400000) : null;
  const daysStr = days !== null ? (days > 0 ? `${days} days to go` : 'Wedding passed') : '';
  document.getElementById('couple-header-content').innerHTML = `
    <div>
      <div class="couple-header-name">${c.partner1_name} & ${c.partner2_name}</div>
      <div class="couple-header-detail">${c.wedding_location || ''} · ${c.wedding_date ? new Date(c.wedding_date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) : 'Date TBD'} · ${c.guest_count || '?'} guests ${daysStr ? '· '+daysStr : ''}</div>
    </div>
    <div class="couple-header-stats">
      <div class="stat-item">
        <div class="stat-val">${state.coupleVendors.filter(v=>v.status==='booked').length || 0}</div>
        <div class="stat-label">Booked</div>
      </div>
      <div class="stat-item">
        <div class="stat-val">${state.tasks.filter(t=>!t.completed).length || 0}</div>
        <div class="stat-label">Tasks</div>
      </div>
      <div class="stat-item">
        <div class="stat-val">€${(c.budget_goal||0).toLocaleString()}</div>
        <div class="stat-label">Budget Goal</div>
      </div>
    </div>
  `;
}

async function loadCoupleData() {
  const cid = state.currentCouple.id;
  try {
    [state.coupleVendors, state.tasks, state.budgetItems, state.mediaFiles, state.chatThreads] = await Promise.all([
      sbGet('couple_vendors', `couple_id=eq.${cid}&order=created_at.asc`).catch(()=>[]),
      sbGet('tasks', `couple_id=eq.${cid}&order=due_date.asc`).catch(()=>[]),
      sbGet('budget_items', `couple_id=eq.${cid}&order=sort_order.asc`).catch(()=>[]),
      sbGet('media_files', `couple_id=eq.${cid}&order=created_at.desc`).catch(()=>[]),
      sbGet('chat_threads', `couple_id=eq.${cid}&order=sort_order.asc`).catch(()=>[]),
    ]);
    // resolve vendor names
    const vendorIds = [...new Set(state.coupleVendors.map(v=>v.vendor_id))];
    for(const vid of vendorIds) {
      if(!state.vendorCache[vid]) {
        const res = await sbGet('vendors', `id=eq.${vid}&select=id,name,category`).catch(()=>[]);
        if(res[0]) state.vendorCache[vid] = res[0];
      }
    }
  } catch(e) { toast('Error loading data: '+e.message); }
}

// ── Tabs ──────────────────────────────────────
function switchTab(tab, btn) {
  state.currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderTab(tab);
}

function renderTab(tab) {
  const el = document.getElementById('tab-content');
  if(tab==='overview') el.innerHTML = buildOverview();
  else if(tab==='budget') el.innerHTML = buildBudget();
  else if(tab==='plan') el.innerHTML = buildPlan();
  else if(tab==='media') el.innerHTML = buildMedia();
  else if(tab==='chat') { el.innerHTML = buildChat(); initChat(); }
}

// ── OVERVIEW ─────────────────────────────────
function buildOverview() {
  let html = `<div class="overview-toolbar">
    <h2>Wedding Overview</h2>
    <button class="btn-sm primary" onclick="openAssignVendorGlobal()">＋ Assign Vendor</button>
  </div>`;

  CATEGORIES.forEach(cat => {
    const catVendors = state.coupleVendors.filter(cv => cv.category === cat.key);
    const decided = catVendors.some(cv=>cv.status==='booked'||cv.status==='decided');
    html += `<div class="category-row">
      <div class="cat-row-header" onclick="toggleCat(this)">
        <span class="cat-emoji">${cat.emoji}</span>
        <span class="cat-name">${cat.label}</span>
        <span class="cat-status ${decided?'decided':'draft'}">${decided?'✓ Decided':'DRAFT'}</span>
        <div class="cat-actions" onclick="event.stopPropagation()">
          <button class="cat-icon-btn" title="Edit" onclick="editCatNote('${cat.key}')">✏️</button>
          <button class="cat-icon-btn" title="Compare" onclick="openCompare('${cat.key}','${cat.label}')">⊞</button>
          <button class="cat-icon-btn" title="Chat" onclick="switchToChat('${cat.key}')">💬</button>
        </div>
        <span class="cat-chevron">▾</span>
      </div>
      <div class="cat-body">
        <div class="vendor-chips">
          ${catVendors.length ? catVendors.map(cv => {
            const v = state.vendorCache[cv.vendor_id];
            return `<div class="vendor-chip" onclick="openVendorCard('${cv.id}')">
              <span class="chip-status ${cv.status}"></span>
              ${v ? v.name : cv.vendor_id}
              <span style="font-size:0.7rem;color:var(--light)">${cv.status}</span>
            </div>`;
          }).join('') : '<div class="cat-no-vendors">No vendors assigned yet</div>'}
        </div>
        <div class="cat-add-vendor" style="margin-top:10px;">
          <div class="vendor-search-wrap">
            <input type="text" placeholder="Search & assign vendor…" oninput="searchVendors(this,'${cat.key}')" onfocus="this.nextElementSibling.style.display='block'" onblur="setTimeout(()=>{this.nextElementSibling.style.display='none'},200)"/>
            <div class="vendor-dropdown" style="display:none;" id="dd-${cat.key}"></div>
          </div>
        </div>
      </div>
    </div>`;
  });
  return html;
}

function toggleCat(header) {
  const body = header.nextElementSibling;
  const chev = header.querySelector('.cat-chevron');
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

async function searchVendors(input, catKey) {
  const q = input.value.trim();
  const dd = document.getElementById('dd-'+catKey);
  if(q.length < 2) { dd.innerHTML=''; return; }
  try {
    const res = await sbGet('vendors', `name=ilike.*${encodeURIComponent(q)}*&category=eq.${catKey}&select=id,name&limit=8`);
    if(!res.length) { dd.innerHTML='<div class="vendor-dd-item" style="color:var(--light)">No results</div>'; return; }
    dd.innerHTML = res.map(v => `<div class="vendor-dd-item" onclick="assignVendor('${v.id}','${catKey}','${v.name.replace(/'/g,"\\'")}');this.closest('.vendor-search-wrap').querySelector('input').value='';">${v.name}</div>`).join('');
  } catch(e) {}
}

async function assignVendor(vendorId, category, vendorName) {
  try {
    const existing = state.coupleVendors.find(cv=>cv.vendor_id===vendorId);
    if(existing) { toast('Already assigned'); return; }
    const res = await sbPost('couple_vendors', {
      couple_id: state.currentCouple.id,
      vendor_id: vendorId,
      category: category,
      status: 'suggested'
    });
    state.coupleVendors.push(res[0]);
    if(!state.vendorCache[vendorId]) state.vendorCache[vendorId] = {id:vendorId,name:vendorName,category};
    toast(`${vendorName} assigned!`);
    renderTab('overview');
  } catch(e) { toast('Error: '+e.message); }
}

async function openVendorCard(cvId) {
  const cv = state.coupleVendors.find(c=>c.id===cvId);
  if(!cv) return;
  const v = state.vendorCache[cv.vendor_id];
  const name = v ? v.name : cv.vendor_id;
  const statuses = ['suggested','shortlisted','decided','booked','rejected'];
  const opts = statuses.map(s=>`<option value="${s}" ${cv.status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('');
  const hearts = [1,2,3,4,5].map(i=>`<span style="cursor:pointer;font-size:1.2rem;color:${i<=(cv.rating||0)?'var(--rose)':'var(--border-strong)'}" onclick="rateVendorInCard('${cvId}',${i})">♥</span>`).join('');
  showQuickModal(`<b>${name}</b>`,`
    <div style="margin-bottom:12px">
      <div class="form-label">Status</div>
      <select class="form-input" id="vc-status" onchange="updateCVStatus('${cvId}',this.value)">${opts}</select>
    </div>
    <div style="margin-bottom:12px">
      <div class="form-label">Rating</div>
      <div id="vc-hearts">${hearts}</div>
    </div>
    <div style="margin-bottom:12px">
      <div class="form-label">Price Quoted (€)</div>
      <input class="form-input" id="vc-price" type="number" value="${cv.price_quoted||''}" placeholder="0" onchange="updateCVField('${cvId}','price_quoted',this.value)"/>
    </div>
    <div style="margin-bottom:12px">
      <div class="form-label">Admin Notes (hidden from couple)</div>
      <textarea class="form-input" id="vc-notes" rows="2" onchange="updateCVField('${cvId}','admin_notes',this.value)">${cv.admin_notes||''}</textarea>
    </div>
    <div>
      <div class="form-label">Couple Notes</div>
      <textarea class="form-input" id="vc-cnotes" rows="2" onchange="updateCVField('${cvId}','couple_notes',this.value)">${cv.couple_notes||''}</textarea>
    </div>
    <div style="margin-top:14px;text-align:right">
      <button class="btn-sm" style="color:var(--rose);border-color:var(--rose)" onclick="removeVendor('${cvId}')">Remove</button>
    </div>
  `);
}

async function rateVendorInCard(cvId, rating) {
  await updateCVField(cvId, 'rating', rating);
  const cv = state.coupleVendors.find(c=>c.id===cvId);
  const hearts = document.getElementById('vc-hearts');
  if(hearts) hearts.innerHTML = [1,2,3,4,5].map(i=>`<span style="cursor:pointer;font-size:1.2rem;color:${i<=rating?'var(--rose)':'var(--border-strong)'}" onclick="rateVendorInCard('${cvId}',${i})">♥</span>`).join('');
}

async function updateCVStatus(cvId, status) {
  const cv = state.coupleVendors.find(c=>c.id===cvId);
  if(!cv) return;
  cv.status = status;
  await sbPatch('couple_vendors', `id=eq.${cvId}`, {status}).catch(e=>toast('Error: '+e.message));
  renderTab('overview');
}

async function updateCVField(cvId, field, value) {
  const cv = state.coupleVendors.find(c=>c.id===cvId);
  if(!cv) return;
  cv[field] = value;
  await sbPatch('couple_vendors', `id=eq.${cvId}`, {[field]:value}).catch(e=>toast('Error: '+e.message));
}

async function removeVendor(cvId) {
  if(!confirm('Remove this vendor?')) return;
  await sbDelete('couple_vendors', `id=eq.${cvId}`).catch(e=>toast('Error: '+e.message));
  state.coupleVendors = state.coupleVendors.filter(c=>c.id!==cvId);
  closeQuickModal();
  renderTab('overview');
  toast('Vendor removed');
}

function openCompare(catKey, catLabel) {
  const catVendors = state.coupleVendors.filter(cv=>cv.category===catKey);
  if(!catVendors.length) { toast('No vendors in this category yet'); return; }
  let cardsHtml = catVendors.map(cv=>{
    const v = state.vendorCache[cv.vendor_id];
    return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;flex:1;min-width:180px;">
      <div style="font-weight:500;margin-bottom:6px">${v?v.name:cv.vendor_id}</div>
      <div style="font-size:0.75rem;color:var(--mid);margin-bottom:8px">${cv.status}</div>
      <div>${[1,2,3,4,5].map(i=>`<span style="color:${i<=(cv.rating||0)?'var(--rose)':'var(--border-strong)'}">♥</span>`).join('')}</div>
      ${cv.price_quoted?`<div style="margin-top:8px;font-weight:500;color:var(--gold-dark)">€${Number(cv.price_quoted).toLocaleString()}</div>`:''}
      ${cv.couple_notes?`<div style="font-size:0.75rem;color:var(--mid);margin-top:6px">${cv.couple_notes}</div>`:''}
    </div>`;
  }).join('');
  showQuickModal(`Compare — ${catLabel}`,`<div style="display:flex;gap:12px;flex-wrap:wrap">${cardsHtml}</div>`);
}

function switchToChat(catKey) {
  switchTab('chat', document.querySelectorAll('.tab-btn')[4]);
  setTimeout(()=>selectThread(catKey),200);
}

// ── BUDGET ───────────────────────────────────
function buildBudget() {
  let totalPending=0, totalPaid=0, totalGoal=0, totalActual=0;

  CATEGORIES.forEach(cat => {
    const items = state.budgetItems.filter(b=>b.category===cat.key);
    items.forEach(b=>{
      totalPending += Number(b.item_price||0) - Number(b.amount_paid||0);
      totalPaid += Number(b.amount_paid||0);
      const goal = Number(b.guests||0) * Number(b.item_price||0) || Number(b.item_price||0);
      totalGoal += goal;
      totalActual += goal;
    });
  });

  let html = `
    <div class="budget-summary">
      <div class="budget-card pending"><div class="val">€${totalPending.toLocaleString()}</div><div class="lbl">Pending</div></div>
      <div class="budget-card paid"><div class="val">€${totalPaid.toLocaleString()}</div><div class="lbl">Paid</div></div>
      <div class="budget-card"><div class="val">€${(state.currentCouple.budget_goal||0).toLocaleString()}</div><div class="lbl">Goal</div></div>
      <div class="budget-card ${totalActual > (state.currentCouple.budget_goal||Infinity) ? 'over':''}"><div class="val">€${totalActual.toLocaleString()}</div><div class="lbl">Actual</div></div>
    </div>
    <div class="budget-col-label">
      <span>Category</span><span>Pending</span><span>Paid</span><span>Goal</span><span>Actual</span><span></span>
    </div>`;

  CATEGORIES.forEach(cat => {
    const items = state.budgetItems.filter(b=>b.category===cat.key);
    let catPending=0, catPaid=0, catGoal=0;
    items.forEach(b=>{
      catPaid += Number(b.amount_paid||0);
      catGoal += Number(b.item_price||0);
    });
    catPending = catGoal - catPaid;
    const catActual = catGoal;
    const decided = items.some(b=>b.status==='decided');
    const over = catActual > catGoal && catGoal > 0;

    html += `<div class="budget-row">
      <div class="budget-row-header" onclick="toggleBudgetRow(this)">
        <span class="budget-col name">${cat.emoji} ${cat.label} <span class="cat-status ${decided?'decided':'draft'}" style="margin-left:6px">${decided?'✓':'DRAFT'}</span></span>
        <span class="budget-col">€${catPending.toLocaleString()}</span>
        <span class="budget-col" style="color:var(--green)">€${catPaid.toLocaleString()}</span>
        <span class="budget-col">€${catGoal.toLocaleString()}</span>
        <span class="budget-col ${over?'over':''}">€${catActual.toLocaleString()}</span>
        <span style="color:var(--light);font-size:0.8rem">▾</span>
      </div>
      <div class="budget-body">
        ${items.map(b=>`
          <div class="budget-item-row">
            <span class="budget-item-name">${b.item_name}</span>
            <span class="budget-commission">(+${b.commission_rate||0}%)</span>
            <span class="budget-item-val">€${Number(b.item_price||0).toLocaleString()}</span>
            <button class="cat-icon-btn" onclick="removeBudgetItem('${b.id}','${cat.key}')">✕</button>
          </div>`).join('')}
        <div class="budget-add-item">
          <input id="bi-name-${cat.key}" placeholder="Item name" style="flex:2"/>
          <input id="bi-price-${cat.key}" type="number" placeholder="Price (€)" style="width:120px"/>
          <input id="bi-comm-${cat.key}" type="number" placeholder="Commission %" style="width:120px"/>
          <button class="btn-sm primary" onclick="addBudgetItem('${cat.key}')">＋</button>
        </div>
      </div>
    </div>`;
  });
  return html;
}

function toggleBudgetRow(header) {
  const body = header.nextElementSibling;
  body.classList.toggle('open');
}

async function addBudgetItem(catKey) {
  const name = document.getElementById(`bi-name-${catKey}`)?.value.trim();
  const price = parseFloat(document.getElementById(`bi-price-${catKey}`)?.value) || 0;
  const comm = parseFloat(document.getElementById(`bi-comm-${catKey}`)?.value) || 0;
  if(!name) { toast('Enter item name'); return; }
  try {
    const res = await sbPost('budget_items', {
      couple_id: state.currentCouple.id,
      category: catKey,
      item_name: name,
      item_price: price,
      commission_rate: comm,
      sort_order: state.budgetItems.length
    });
    state.budgetItems.push(res[0]);
    toast('Item added!');
    renderTab('budget');
  } catch(e) { toast('Error: '+e.message); }
}

async function removeBudgetItem(id, catKey) {
  await sbDelete('budget_items', `id=eq.${id}`).catch(e=>toast('Error: '+e.message));
  state.budgetItems = state.budgetItems.filter(b=>b.id!==id);
  renderTab('budget');
}

// ── PLAN ─────────────────────────────────────
function buildPlan() {
  let html = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <h2 style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.4rem;flex:1">Wedding Timeline</h2>
      <button class="btn-sm primary" onclick="showAddTask()">＋ Add Task</button>
    </div>
    <div id="task-form-wrap" style="display:none;">
      <div class="task-form">
        <input id="t-title" placeholder="Task title" style="flex:2"/>
        <select id="t-cat">
          <option value="">Category…</option>
          ${CATEGORIES.map(c=>`<option value="${c.key}">${c.label}</option>`).join('')}
        </select>
        <input id="t-due" type="date"/>
        <button class="btn-sm primary" onclick="addTask()">Save</button>
        <button class="btn-sm" onclick="hideAddTask()">Cancel</button>
      </div>
    </div>`;

  // Group tasks by month
  const tasks = [...state.tasks].sort((a,b)=>(a.due_date||'9999')>(b.due_date||'9999')?1:-1);
  const groups = {};
  tasks.forEach(t=>{
    const key = t.due_date ? t.due_date.slice(0,7) : 'no-date';
    if(!groups[key]) groups[key] = [];
    groups[key].push(t);
  });

  if(!tasks.length) {
    html += `<div class="empty-state"><div class="icon">📋</div><p>No tasks yet. Add one above!</p></div>`;
  } else {
    Object.entries(groups).forEach(([monthKey, monthTasks])=>{
      const label = monthKey==='no-date' ? 'No Date' : new Date(monthKey+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
      html += `<div class="month-group">
        <div class="month-label">${label}</div>
        ${monthTasks.map(t=>{
          const overdue = t.due_date && !t.completed && new Date(t.due_date) < new Date();
          return `<div class="plan-item">
            <div class="plan-check ${t.completed?'done':''}" onclick="toggleTask('${t.id}','${t.completed}')">
              ${t.completed ? '✓' : ''}
            </div>
            <div class="plan-title ${t.completed?'done':''}">${t.title}
              ${t.category ? `<span style="font-size:0.72rem;color:var(--light);margin-left:6px">${CATEGORIES.find(c=>c.key===t.category)?.label||t.category}</span>` : ''}
            </div>
            <div class="plan-date ${overdue?'overdue':''}">${t.due_date ? new Date(t.due_date).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : ''} ${overdue?'⚠️':''}</div>
            <button class="cat-icon-btn" onclick="deleteTask('${t.id}')" style="margin-left:8px">✕</button>
          </div>`;
        }).join('')}
      </div>`;
    });
  }
  return html;
}

function showAddTask() { document.getElementById('task-form-wrap').style.display='block'; }
function hideAddTask() { document.getElementById('task-form-wrap').style.display='none'; }

async function addTask() {
  const title = document.getElementById('t-title').value.trim();
  const cat = document.getElementById('t-cat').value;
  const due = document.getElementById('t-due').value;
  if(!title) { toast('Enter task title'); return; }
  try {
    const res = await sbPost('tasks', {couple_id:state.currentCouple.id,title,category:cat||null,due_date:due||null});
    state.tasks.push(res[0]);
    hideAddTask();
    toast('Task added!');
    renderTab('plan');
  } catch(e) { toast('Error: '+e.message); }
}

async function toggleTask(id, currentCompleted) {
  const done = currentCompleted === 'true' || currentCompleted === true;
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  t.completed = !done;
  await sbPatch('tasks', `id=eq.${id}`, {completed:!done, completed_at: !done ? new Date().toISOString() : null}).catch(e=>toast('Error: '+e.message));
  renderTab('plan');
}

async function deleteTask(id) {
  if(!confirm('Delete this task?')) return;
  await sbDelete('tasks', `id=eq.${id}`).catch(e=>toast('Error: '+e.message));
  state.tasks = state.tasks.filter(t=>t.id!==id);
  renderTab('plan');
}

// ── MEDIA ─────────────────────────────────────
function buildMedia() {
  const icons = {contract:'📄',invoice:'🧾',proof_of_payment:'✅',offer:'📋',other:'📎'};
  let html = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <h2 style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.4rem;flex:1">Media & Documents</h2>
    </div>
    <div class="media-upload" onclick="toast('File upload requires Supabase Storage — coming soon!')">
      <div class="media-upload-icon">☁️</div>
      <div class="media-upload-text">Click to upload files — contracts, invoices, offers, photos</div>
      <div style="font-size:0.72rem;color:var(--light);margin-top:6px">PDF, DOCX, PPTX, JPG, PNG</div>
    </div>`;

  if(!state.mediaFiles.length) {
    html += `<div class="empty-state"><div class="icon">🖼</div><p>No files uploaded yet</p></div>`;
  } else {
    html += `<div class="media-grid">`;
    state.mediaFiles.forEach(f=>{
      const icon = icons[f.file_type] || '📎';
      html += `<div class="media-card">
        <div class="media-icon">${icon}</div>
        <div class="media-name">${f.file_name}</div>
        <div class="media-meta">${f.file_type||'file'} · ${new Date(f.created_at).toLocaleDateString()}</div>
        <div style="margin-top:6px;font-size:0.72rem;color:${f.visible_to_couple?'var(--green)':'var(--rose)'}">
          ${f.visible_to_couple?'👁 Visible to couple':'🔒 Planner only'}
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

// ── CHAT ─────────────────────────────────────
function buildChat() {
  return `<div class="chat-wrap">
    <div class="chat-sidebar" id="chat-sidebar-el">
      <div style="padding:12px 14px;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--light);border-bottom:1px solid var(--border)">Threads</div>
      <div id="thread-list"></div>
    </div>
    <div class="chat-area" id="chat-area-el">
      <div class="chat-header" id="chat-header-el">Select a thread</div>
      <div class="chat-messages" id="chat-messages-el"><div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--light);font-size:0.85rem;">Select a category to start chatting</div></div>
      <div class="chat-input-wrap" id="chat-input-wrap" style="display:none">
        <input id="chat-input" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendChatMessage()"/>
        <button class="chat-send" onclick="sendChatMessage()">➤</button>
      </div>
    </div>
  </div>`;
}

async function initChat() {
  // Build thread list from CATEGORIES + existing threads
  const threadListEl = document.getElementById('thread-list');
  if(!threadListEl) return;

  // General thread first
  let html = `<div class="chat-thread-item" onclick="selectThread('general')">
    <div class="chat-thread-name">💬 General Chat</div>
    <div class="chat-thread-preview">General conversation</div>
  </div>`;

  CATEGORIES.forEach(cat => {
    const catVendors = state.coupleVendors.filter(cv=>cv.category===cat.key);
    html += `<div class="chat-thread-item" onclick="selectThread('${cat.key}')">
      <div class="chat-thread-name">${cat.emoji} ${cat.label}</div>
    </div>`;
    catVendors.forEach(cv=>{
      const v = state.vendorCache[cv.vendor_id];
      if(v) html += `<div class="chat-vendor-item" onclick="selectThread('${cat.key}','${cv.vendor_id}')">
        <div class="chat-vendor-name">› ${v.name}</div>
      </div>`;
    });
  });
  threadListEl.innerHTML = html;
}

async function selectThread(catKey, vendorId=null) {
  state.currentThread = {catKey, vendorId};

  // Highlight active
  document.querySelectorAll('.chat-thread-item,.chat-vendor-item').forEach(el=>el.classList.remove('active'));

  const header = document.getElementById('chat-header-el');
  const cat = CATEGORIES.find(c=>c.key===catKey);
  const v = vendorId ? state.vendorCache[vendorId] : null;
  if(header) header.textContent = v ? v.name : (cat ? `${cat.emoji} ${cat.label}` : '💬 General Chat');

  document.getElementById('chat-input-wrap').style.display = 'flex';

  // Load messages
  try {
    let query = `couple_id=eq.${state.currentCouple.id}&order=created_at.asc`;
    if(vendorId) query += `&category=eq.${catKey}_${vendorId}`;
    else query += `&category=eq.${catKey}`;
    const msgs = await sbGet('messages', query);
    renderMessages(msgs);
  } catch(e) {
    renderMessages([]);
  }
}

function renderMessages(msgs) {
  const el = document.getElementById('chat-messages-el');
  if(!el) return;
  if(!msgs.length) {
    el.innerHTML = '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--light);font-size:0.85rem;">No messages yet. Start the conversation!</div>';
    return;
  }
  el.innerHTML = msgs.map(m=>`
    <div class="chat-msg ${m.sender}">
      <div>${m.content}</div>
      <div class="chat-msg-meta">${m.sender_name||m.sender} · ${new Date(m.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div>
    </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

async function sendChatMessage() {
  const input = document.getElementById('chat-input');
  if(!input) return;
  const content = input.value.trim();
  if(!content) return;
  const {catKey, vendorId} = state.currentThread || {};
  const category = vendorId ? `${catKey}_${vendorId}` : catKey;
  try {
    await sbPost('messages', {
      couple_id: state.currentCouple.id,
      sender: 'planner',
      sender_name: 'Niovi',
      content,
      category: category || 'general',
      read_by_couple: false,
      read_by_planner: true
    });
    input.value = '';
    await selectThread(catKey, vendorId);
    toast('Message sent!');
  } catch(e) { toast('Error: '+e.message); }
}

// ── CREATE COUPLE ─────────────────────────────
async function createCouple() {
  const p1 = document.getElementById('f-p1').value.trim();
  const p2 = document.getElementById('f-p2').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const pass = document.getElementById('f-pass').value.trim();
  if(!p1||!p2||!email) { toast('Fill in required fields'); return; }
  try {
    const res = await sbPost('couples', {
      partner1_name: p1,
      partner2_name: p2,
      name: `${p1} & ${p2}`,
      email,
      password_hash: pass,
      wedding_date: document.getElementById('f-date').value || null,
      wedding_location: document.getElementById('f-loc').value || null,
      guest_count: parseInt(document.getElementById('f-guests').value) || null,
      budget_goal: parseFloat(document.getElementById('f-budget').value) || null,
      notes: document.getElementById('f-notes').value || null,
    });
    state.couples.push(res[0]);
    closeModal('add-couple-modal');
    renderCoupleList();
    toast('Couple created! 🌸');
    selectCouple(res[0].id);
  } catch(e) { toast('Error: '+e.message); }
}

// ── MODAL ─────────────────────────────────────
let _quickModal = null;
function showQuickModal(title, body) {
  if(_quickModal) document.body.removeChild(_quickModal);
  _quickModal = document.createElement('div');
  _quickModal.className = 'modal-overlay open';
  _quickModal.innerHTML = `<div class="modal">
    <div class="modal-header">
      <div class="modal-title">${title}</div>
      <button class="modal-close" onclick="closeQuickModal()">✕</button>
    </div>
    <div class="modal-body">${body}</div>
  </div>`;
  _quickModal.addEventListener('click',e=>{if(e.target===_quickModal)closeQuickModal();});
  document.body.appendChild(_quickModal);
}
function closeQuickModal() { if(_quickModal){document.body.removeChild(_quickModal);_quickModal=null;} }

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.addEventListener('click', e=>{
  if(e.target.classList.contains('modal-overlay')) closeModal(e.target.id);
});

// ── TOAST ─────────────────────────────────────
function toast(msg, dur=2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), dur);
}

// ── INIT ──────────────────────────────────────
document.getElementById('pw-input').addEventListener('keydown', e=>{
  if(e.key==='Enter') checkPw();
});
</script>
